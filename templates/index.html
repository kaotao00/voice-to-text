<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>会记 · 本地会议纪要终端</title><link rel="stylesheet" href="static/styles.css">
</head>
<body>
  <header><div><p class="eyebrow">LOCAL FIRST · MEETING INTELLIGENCE</p><h1>会记</h1></div><span id="health">设备就绪</span></header>
  <main>
    <section class="hero"><div><h2>每一次会议，都有清晰结论。</h2><p>会议室终端在本地录音、离线转写、匿名区分发言人，并生成可追溯的会议纪要。</p></div>
      <div class="record-card"><label>会议名称<input id="meeting-title" placeholder="例如：周例会 / 项目评审"></label><button id="record-button">开始会议录音</button><p id="record-state">浏览器将请求麦克风权限。</p><span id="timer">00:00</span></div>
    </section>
    <section class="layout"><aside><div class="section-title"><h3>会议记录</h3><button class="plain" id="refresh">刷新</button></div><div id="meeting-list" class="meeting-list"></div></aside>
      <article id="detail" class="detail empty"><div><h2>选择一场会议</h2><p>录音结束后，系统会在本地完成转写与整理。你可随时从此设备 IP 查看历史会议。</p></div></article>
    </section>
  </main><template id="meeting-template"><button class="meeting-item"><strong></strong><span></span><em></em></button></template><script src="static/app.js"></script>
</body></html>
